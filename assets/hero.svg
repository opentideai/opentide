<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-label="OpenTide: make your agent ship production-ready apps. Fewer bugs, fewer review rounds, fewer tokens.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1230"/>
      <stop offset="0.55" stop-color="#0f1b3f"/>
      <stop offset="1" stop-color="#14254f"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8EC9E8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8EC9E8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8EC9E8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F8FD6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4F8FD6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4F8FD6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wave3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2A03D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F2A03D" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#F2A03D" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4F8FD6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#4F8FD6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#94a3b8" fill-opacity="0.12"/>
    </pattern>
    <clipPath id="card">
      <rect width="1280" height="440" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="440" fill="url(#bg)"/>
    <rect width="1280" height="440" fill="url(#dots)"/>
    <ellipse cx="380" cy="190" rx="420" ry="220" fill="url(#glow)"/>

    <!-- Tide: three swells drifting past each other -->
    <g>
      <path d="M-1280 330 Q-1120 290 -960 330 T-640 330 T-320 330 T0 330 T320 330 T640 330 T960 330 T1280 330 T1600 330 T1920 330 T2240 330 T2560 330"
            fill="none" stroke="url(#wave1)" stroke-width="3">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="640 0" dur="14s" repeatCount="indefinite"/>
      </path>
      <path d="M-1280 360 Q-1100 320 -920 360 T-560 360 T-200 360 T160 360 T520 360 T880 360 T1240 360 T1600 360 T1960 360 T2320 360"
            fill="none" stroke="url(#wave2)" stroke-width="2.5">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="720 0" dur="19s" repeatCount="indefinite"/>
      </path>
      <path d="M-1280 392 Q-1140 362 -1000 392 T-720 392 T-440 392 T-160 392 T120 392 T400 392 T680 392 T960 392 T1240 392 T1520 392 T1800 392 T2080 392"
            fill="none" stroke="url(#wave3)" stroke-width="2">
        <animateTransform attributeName="transform" type="translate" from="560 0" to="0 0" dur="23s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- Mark (opentide.ai) -->
