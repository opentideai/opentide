<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Fewer bugs: nothing lands without tests the server ran. Less review: every change comes with its plan and its proof. Fewer tokens: the agent asks the app instead of rereading your code.">
  <style>
    .ui { font-family: ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
    .pulse { animation: pulse 2.2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes pulse { 50% { opacity: 0.45; } }
  </style>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#132650"/>
      <stop offset="1" stop-color="#0c1736"/>
    </linearGradient>
  </defs>

  <!-- FEWER BUGS -->
  <g transform="translate(0 0)">
    <rect x="1" y="1" width="382" height="278" rx="22" fill="url(#card)" stroke="#2a4a7a"/>
    <g transform="translate(32 34)">
      <rect width="60" height="60" rx="16" fill="#16294f"/>
      <path d="M30 10 L46 16 V30 C46 40 39 47 30 51 C21 47 14 40 14 30 V16 Z" fill="none" stroke="#4F8FD6" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M22 30 L28 36 L39 24" fill="none" stroke="#4F8FD6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" class="pulse"/>
    </g>
    <text x="32" y="138" class="ui" font-size="34" font-weight="800" fill="#f8fafc">Fewer bugs</text>
    <text class="ui" font-size="17" fill="#94a3b8">
      <tspan x="32" y="176">A change can’t close until tests the</tspan>
      <tspan x="32" y="202">server itself ran cover every promise</tspan>
      <tspan x="32" y="228">in the plan. Builds are booted and</tspan>
      <tspan x="32" y="254">smoke-tested before you ship.</tspan>
    </text>
  </g>

  <!-- LESS REVIEW -->
  <g transform="translate(408 0)">
    <rect x="1" y="1" width="382" height="278" rx="22" fill="url(#card)" stroke="#2a4a7a"/>
    <g transform="translate(32 34)">
      <rect width="60" height="60" rx="16" fill="#16294f"/>
      <path d="M18 10 H36 L44 18 V50 H18 Z" fill="none" stroke="#8EC9E8" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M24 34 L29 39 L38 28" fill="none" stroke="#8EC9E8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" class="pulse"/>
    </g>
    <text x="32" y="138" class="ui" font-size="34" font-weight="800" fill="#f8fafc">Less review</text>
    <text class="ui" font-size="17" fill="#94a3b8">
      <tspan x="32" y="176">Every change arrives with its plan,</tspan>
      <tspan x="32" y="202">acceptance criteria and evidence, and</tspan>
      <tspan x="32" y="228">every edit records why it was made.</tspan>
      <tspan x="32" y="254">Read the proof, not a 900-line diff.</tspan>
    </text>
  </g>

  <!-- FEWER TOKENS -->
  <g transform="translate(816 0)">
    <rect x="1" y="1" width="382" height="278" rx="22" fill="url(#card)" stroke="#6b4a20"/>
    <g transform="translate(32 34)">
      <rect width="60" height="60" rx="16" fill="#3a2a1a"/>
      <path d="M33 10 L18 34 H30 L26 50 L43 24 H31 Z" fill="#F2A03D" class="pulse"/>
    </g>
    <text x="32" y="138" class="ui" font-size="34" font-weight="800" fill="#f8fafc">Fewer tokens</text>
    <text class="ui" font-size="17" fill="#94a3b8">
      <tspan x="32" y="176">The agent asks the app for its routes,</tspan>
      <tspan x="32" y="202">handlers and schemas instead of</tspan>
      <tspan x="32" y="228">rereading files, edits one function</tspan>
      <tspan x="32" y="254">at a time, and gets exact errors back.</tspan>
    </text>
  </g>
</svg>
